name: Deploy to DigitalOcean App Platform

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-digitalocean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app(s) on DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_BACKEND_APP_ID: ${{ secrets.DIGITALOCEAN_BACKEND_APP_ID }}
      DIGITALOCEAN_FRONTEND_APP_ID: ${{ secrets.DIGITALOCEAN_FRONTEND_APP_ID }}
      DIGITALOCEAN_BACKEND_HEALTHCHECK_URL: ${{ secrets.DIGITALOCEAN_BACKEND_HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger backend deployment
        run: |
          if [ -z "$DIGITALOCEAN_BACKEND_APP_ID" ]; then
            echo "DIGITALOCEAN_BACKEND_APP_ID is required."
            exit 1
          fi

          doctl apps create-deployment "$DIGITALOCEAN_BACKEND_APP_ID" --wait

      - name: Optional backend health check
        run: |
          if [ -n "$DIGITALOCEAN_BACKEND_HEALTHCHECK_URL" ]; then
            curl -fsSL "$DIGITALOCEAN_BACKEND_HEALTHCHECK_URL"
          else
            echo "No backend healthcheck URL set; skipping health check."
          fi

      - name: Optional frontend deployment
        run: |
          if [ -n "$DIGITALOCEAN_FRONTEND_APP_ID" ]; then
            doctl apps create-deployment "$DIGITALOCEAN_FRONTEND_APP_ID" --wait
          else
            echo "No DIGITALOCEAN_FRONTEND_APP_ID set; skipping frontend deployment."
          fi
