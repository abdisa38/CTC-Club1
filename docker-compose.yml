services:
  mongo:
    image: mongo:7
    container_name: ctc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ctc-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ctc-club
      JWT_SECRET: change-me-before-prod
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_MAX: 500
      AUTH_RATE_LIMIT_MAX: 20
      VIDEO_UPLOAD_MAX_MB: 512
      RESOURCE_UPLOAD_MAX_MB: 50
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mongo_data:
